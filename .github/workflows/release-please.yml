name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    # Requires repo Settings → Actions → "Allow GitHub Actions to create and
    # approve pull requests". Set repository variable ENABLE_RELEASE_PLEASE=true
    # when that is enabled; otherwise this job is skipped on forks/deploy repos.
    if: vars.ENABLE_RELEASE_PLEASE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Do not set release-type here: it switches the action to simple mode,
      # which ignores release-please-config.json and its changelog-sections.
      # The release type is declared in that config file instead.
      - uses: googleapis/release-please-action@v4.4.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
